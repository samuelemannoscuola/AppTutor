<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sondaggio – App Tutor Studenti</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F2FF;--fg:#12143A;--mut:#585D94;--card:#fff;--line:#DAD7F4;--ink:#0A0B1F;--vio:#7C5CFF;--r:#D6343B;--sec:#D4FF4F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090A1E;--fg:#F4F3FF;--mut:#A7ABD8;--card:#14173D;--line:#2A2F66;--r:#FF7A80}}
:root[data-theme="dark"]{--bg:#090A1E;--fg:#F4F3FF;--mut:#A7ABD8;--card:#14173D;--line:#2A2F66;--r:#FF7A80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.4;overflow-x:hidden}
#app{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;pointer-events:none;transition:background .6s}
.b1{width:46vmax;height:46vmax;right:-14vmax;top:-12vmax;background:var(--sec)}.b2{width:30vmax;height:30vmax;left:-10vmax;bottom:-8vmax;background:var(--vio);opacity:.3}
#bgn{position:absolute;right:4vw;bottom:6vh;font-size:clamp(140px,34vw,420px);font-weight:800;letter-spacing:-.06em;line-height:.8;color:transparent;-webkit-text-stroke:2px var(--line);pointer-events:none;user-select:none}
.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 5vw 10px;max-width:900px;width:100%;margin:0 auto}
.top b{font-size:19px;font-weight:800;letter-spacing:-.02em}.top a,#cnt{color:var(--mut);font-size:14px;text-decoration:none}
.pbar{position:fixed;top:0;left:0;right:0;height:5px;background:var(--line);z-index:5}.pbar i{display:block;height:100%;width:0;background:var(--sec);transition:width .5s,background .6s}
main{position:relative;z-index:2;flex:1;display:flex;align-items:center;padding:10px 5vw 20px;max-width:900px;width:100%;margin:0 auto}
.qv{width:100%}
.qv.n{animation:inN .5s cubic-bezier(.2,.8,.2,1)}.qv.p{animation:inP .5s cubic-bezier(.2,.8,.2,1)}
@keyframes inN{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:none}}@keyframes inP{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.kick{display:inline-flex;gap:8px;align-items:center;background:var(--sec);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:800;margin-bottom:18px;transition:background .6s}
h1,h2{font-weight:800;letter-spacing:-.04em;margin:0;outline:0}
h1{font-size:clamp(40px,9vw,84px);line-height:.95}h2{font-size:clamp(28px,5.6vw,52px);line-height:1.02;margin-bottom:10px}
.it{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;color:var(--vio)}
.sub{color:var(--mut);font-size:clamp(16px,2vw,20px);margin:0 0 26px;max-width:32em}.sub a{color:var(--vio);font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 30px}.facts span{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;font-size:15px}
.ops{display:grid;gap:10px;max-width:640px;margin-top:22px}
.op input,.sc input{position:absolute;opacity:0;pointer-events:none}
.op .bx{display:flex;align-items:center;gap:14px;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px 18px;cursor:pointer;font-size:clamp(16px,2.2vw,20px);font-weight:600;transition:transform .15s,border-color .15s,background .15s;animation:up .5s both;animation-delay:calc(var(--i)*55ms)}
.op .bx:hover{transform:translateX(4px);border-color:var(--sec)}
.lt{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--mut)}
.op input:checked+.bx{background:var(--sec);border-color:var(--sec);color:var(--ink)}.op input:checked+.bx .lt{background:var(--ink);border-color:var(--ink);color:var(--sec)}
.sc{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;margin-top:26px;max-width:760px}
.sc .bx{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:clamp(16px,2.4vw,22px);font-weight:800;cursor:pointer;transition:transform .15s,background .15s;animation:up .5s both;animation-delay:calc(var(--i)*35ms)}
.sc .bx:hover{transform:scale(1.12);border-color:hsl(var(--h) 80% 55%)}
.sc input:checked+.bx{background:hsl(var(--h) 85% 62%);border-color:hsl(var(--h) 85% 62%);color:var(--ink);transform:scale(1.18)}
.leg{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-top:12px;max-width:760px}
.op input:focus-visible+.bx,.sc input:focus-visible+.bx{outline:3px solid var(--vio);outline-offset:3px}
textarea{width:100%;max-width:700px;min-height:170px;padding:18px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:19px;resize:vertical;margin-top:18px}textarea:focus{outline:0;border-color:var(--sec)}
.bar{position:sticky;bottom:0;z-index:3;padding:12px 5vw calc(14px + env(safe-area-inset-bottom,0px));max-width:900px;width:100%;margin:0 auto;display:flex;gap:10px;justify-content:space-between}
.btn{border:0;border-radius:999px;padding:15px 30px;font:inherit;font-weight:800;font-size:18px;background:var(--sec);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;transition:transform .15s,opacity .2s}
.btn:hover:not(:disabled){transform:translateY(-2px)}.btn.g{background:var(--card);color:var(--fg);border:2px solid var(--line)}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.big{padding:20px 40px;font-size:21px}
:focus-visible{outline:3px solid var(--vio);outline-offset:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:0 0 14px;max-width:640px}
.rb{display:flex;align-items:center;gap:10px;margin:9px 0}.rb span:first-child{flex:0 0 40%;font-size:15px}.rb .t{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}.rb i{display:block;height:100%;border-radius:5px;background:var(--vio)}.rb b{width:30px;text-align:right}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}#toast.on{opacity:1}
@media(max-width:560px){.sc{grid-template-columns:repeat(6,1fr)}#bgn{opacity:.6}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="pbar" aria-hidden="true"><i id="pb"></i></div>
<div id="app">
  <div class="blob b1" aria-hidden="true"></div><div class="blob b2" aria-hidden="true"></div><div id="bgn" aria-hidden="true"></div>
  <div class="top"><b>AppTutor</b><span id="cnt"></span><a href="index.html">Esci</a></div>
  <main><div class="qv" id="qv"></div></main>
  <div class="bar" id="bar" hidden><button class="btn g" id="bk">Indietro</button><button class="btn" id="nx">Avanti</button></div>
</div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const SEC=[{n:'Chi sei',c:'#D4FF4F'},{n:'I tuoi bisogni',c:'#4FE3FF'},{n:"Valuta l'app",c:'#FF5FA2'},{n:'Fiducia e prezzo',c:'#B7A5FF'},{n:'Commenti',c:'#D4FF4F'}];
const SC=[['des','Aspetto (design)',"Quanto ti piace l'aspetto dell'app?"],['fun','Funzionalità','Le funzionalità offerte soddisfano le tue esigenze?'],['use','Facilità di utilizzo','Quanto ti sembra facile da usare?'],['bis','Rispondenza ai bisogni',"L'app risponde ai tuoi bisogni specifici di studente?"],['inn','Innovazione',"Quanto la ritieni innovativa rispetto alle app che già conosci?"],['pri','Fiducia e privacy','Quanto ti sentiresti tranquillo a usarla, sapendo che tratta dati su benessere e posizione?'],['val','Costo/valore','Pensi che i piani di abbonamento proposti siano adeguati al valore offerto?'],['nps','Passaparola','Con che probabilità la consiglieresti a un compagno?']];
const Q=[
{s:0,id:'ruolo',k:'one',l:'Qual è il tuo ruolo?',o:['Studente','Volontario buddy','Personale scolastico','Docente','Genitore','Altro']},
{s:0,id:'anno',k:'one',l:'Che classe frequenti?',o:['1ª','2ª','3ª','4ª','5ª','Non sono uno studente']},
{s:0,id:'viaggio',k:'one',l:'Come arrivi a scuola?',o:['A piedi o in bici','Autobus','Treno','Auto o moto','Altro']},
{s:1,id:'diff',k:'many',max:3,l:'Quali cose ti danno più problemi?',h:'Scegline fino a 3.',o:['Organizzare studio e verifiche','Stress e stanchezza',"Orari e affollamento dell'autobus",'Trovare un posto tranquillo dove studiare','Ricevere o dare aiuto tra compagni','Orientarsi al primo anno','Ripassare le materie']},
{s:1,id:'sovr',k:'one',l:'Quanto spesso ti senti sopraffatto da studio e impegni?',o:['Mai','Raramente','A volte','Spesso','Quasi sempre']},
{s:1,id:'app',k:'one',l:'Usi già qualche app per organizzarti?',o:['No','Solo il registro elettronico','Calendario o note','App di studio dedicate']},
...SC.map(([id,n,l],j)=>({s:2,id,k:'sc',n,l,h:j===0?`Voti da 0 a 10. Non l'hai ancora provata? <a href="app.html" target="_blank" rel="noopener">Apri il mockup</a>.`:'Da 0 (molto negativo) a 10 (molto positivo).'})),
{s:2,id:'modulo',k:'many',max:2,l:'Quali moduli useresti di più?',h:'Scegline fino a 2.',o:['Organizzatore di studio','MindCheck','Al Tuo Fianco','Posti sicuri','Autobus','Capsula del Tempo']},
{s:3,id:'mind',k:'one',l:'Useresti MindCheck sapendo che i docenti vedono solo dati anonimi di classe?',h:'I piani ipotizzati sono Base (gratis), Plus (2,99 €/mese) e Scuola (per gli istituti).',o:['Sì, sicuramente','Forse','No']},
{s:3,id:'preoc',k:'many',max:3,l:'Cosa ti preoccupa di più?',h:'Scegline fino a 3.',o:['Privacy dei dati sul benessere','Uso dei dati di posizione','Anonimato dei messaggi','Dati dei minorenni','Contenuti sbagliati nei riassunti','Niente in particolare']},
{s:3,id:'piano',k:'one',l:'Quale piano sceglieresti?',o:['Base (gratis)','Plus (2,99 €/mese)','Solo se la scuola lo offre a tutti','Non la userei']},
{s:3,id:'wtp',k:'one',l:'Quanto pagheresti al mese per funzioni extra come autobus in tempo reale e audio offline?',o:['Niente, solo gratis','Fino a 1 €','1–3 €','3–5 €','Più di 5 €']},
{s:3,id:'paga',k:'one',l:'Chi dovrebbe pagare?',o:['Lo studente','La famiglia','La scuola','Un mix']},
{s:4,id:'manca',k:'text',l:'Quale funzione ti manca?',h:'Facoltativo.'},
{s:4,id:'note',k:'text',l:'Commenti e suggerimenti',h:'Facoltativo. Scrivi quello che le domande non hanno chiesto.'}];
/* CONFIGURAZIONE: incolla qui l'URL dello script Google (finisce con /exec) */
const ENDPOINT='https://script.google.com/macros/s/AKfycbyK3tNUDsFyva3G2Ia3PRU4Myq8LjwQvERqtLgu-x1jBqoWO7MnlLqrioxKcuYf58IVlQ/exec';
let i=-1,ans={},adv;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)};
const ok=q=>q.k==='text'||(q.k==='many'?(ans[q.id]||[]).length>0:ans[q.id]!==undefined);
const hue=v=>Math.round(v*13);
function setSec(c){$('#app').style.setProperty('--sec',c);$('#pb').parentElement.style.setProperty('--sec',c)}
function view(html,dir){const v=$('#qv');v.className='qv '+(dir<0?'p':'n');v.innerHTML=html;void v.offsetWidth;const h=v.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}scrollTo(0,0)}
function intro(){i=-1;setSec(SEC[0].c);$('#bar').hidden=true;$('#cnt').textContent='';$('#bgn').textContent='';$('#pb').style.width='0';
 view(`<div class="kick">Sondaggio per gli studenti</div><h1>Aiutaci a costruire <span class="it">l'app</span></h1><p class="sub">Una domanda alla volta, risposte senza nome. Le useremo per decidere cosa sviluppare e a che prezzo.</p><div class="facts"><span>${Q.length} domande</span><span>circa 4 minuti</span><span>anonimo</span></div><p class="sub" style="font-size:14px;margin-top:-10px">Le risposte sono anonime e usate solo per il progetto scolastico.</p><button class="btn big" id="st">Inizia</button><div id="own"></div>`,1);ownerBtn()}
function show(dir){const q=Q[i],sc=SEC[q.s];setSec(sc.c);$('#bar').hidden=false;
 $('#pb').style.width=(i/Q.length*100)+'%';$('#cnt').textContent=`${i+1} / ${Q.length}`;$('#bgn').textContent=String(i+1).padStart(2,'0');
 let b='';
 if(q.k==='sc')b=`<div class="sc" role="radiogroup" aria-label="${q.l}">${[...Array(11).keys()].map(v=>`<label class="op"><input type="radio" name="${q.id}" value="${v}" ${ans[q.id]===v?'checked':''}><span class="bx" style="--i:${v};--h:${hue(v)}">${v}</span></label>`).join('')}</div><div class="leg"><span>0 · molto negativo</span><span>10 · molto positivo</span></div>`;
 else if(q.k==='text')b=`<textarea id="${q.id}" aria-label="${q.l}" placeholder="Scrivi qui…">${ans[q.id]||''}</textarea>`;
 else b=`<div class="ops">${q.o.map((o,j)=>`<label class="op"><input type="${q.k==='many'?'checkbox':'radio'}" name="${q.id}" value="${o}" ${(q.k==='many'?(ans[q.id]||[]).includes(o):ans[q.id]===o)?'checked':''}><span class="bx" style="--i:${j}"><span class="lt">${String.fromCharCode(65+j)}</span>${o}</span></label>`).join('')}</div>`;
 view(`<div class="kick">${sc.n}${q.n?' · '+q.n:''}</div><h2>${q.l}</h2>${q.h?`<p class="sub" style="margin:0">${q.h}</p>`:''}${b}`,dir);upd()}
function upd(){const q=Q[i];if(!q)return;const n=$('#nx');n.disabled=!ok(q);n.textContent=i===Q.length-1?'Invia le risposte':q.k==='text'&&!(ans[q.id]||'').trim()?'Salta':q.k==='many'||q.k==='text'?'Avanti':'Avanti'}
function go(d){clearTimeout(adv);if(d>0){if(!ok(Q[i]))return toast('Scegli una risposta per continuare');if(i===Q.length-1)return send();i++}else{if(i<=0)return intro();i--}show(d)}
document.addEventListener('change',e=>{const t=e.target;if(!t.name)return;const q=Q.find(x=>x.id===t.name);if(!q)return;
 if(q.k==='many'){const a=ans[q.id]||[];if(t.checked){if(a.length>=q.max){t.checked=false;return toast('Puoi sceglierne al massimo '+q.max)}a.push(t.value)}else a.splice(a.indexOf(t.value),1);ans[q.id]=a;upd()}
 else{ans[q.id]=q.k==='sc'?+t.value:t.value;upd();clearTimeout(adv);adv=setTimeout(()=>{if(Q[i]===q)go(1)},420)}});
document.addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA'){ans[e.target.id]=e.target.value;upd()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='st'){i=0;show(1)}if(b.id==='nx')go(1);if(b.id==='bk')go(-1);if(b.id==='res')results();if(b.id==='again')intro()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&i>=0&&e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='BUTTON'){e.preventDefault();go(1)}});
async function send(){$('#nx').disabled=true;let saved=false;
 if(ENDPOINT){const p={};Object.keys(ans).forEach(k=>p[k]=Array.isArray(ans[k])?ans[k].join(' | '):ans[k]);
  try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});saved=true}catch(e){$('#nx').disabled=false;return toast('Invio non riuscito. Controlla la connessione e riprova')}}
 else try{if(window.claude){const[db,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(db&&u){await db.doc('responses/'+await u.id()).set({...ans,ts:Date.now()});saved=true}}}catch(e){}
 $('#bar').hidden=true;$('#pb').style.width='100%';$('#cnt').textContent='';$('#bgn').textContent='✓';setSec('#D4FF4F');
 view(`<div class="kick">Fatto</div><h1>Grazie, <span class="it">davvero.</span></h1><p class="sub">${saved?'Le tue risposte sono state inviate.':"Questa è un'anteprima: la raccolta online delle risposte non è ancora attiva, quindi nulla è stato salvato."}</p>
 <div class="card"><b>Le tue valutazioni</b>${SC.map(([id,n])=>`<div class="rb"><span>${n}</span><span class="t"><i style="width:${ans[id]*10}%"></i></span><b>${ans[id]}</b></div>`).join('')}</div>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="index.html">Torna al sito</a><a class="btn g" href="app.html" target="_blank" rel="noopener">Prova il mockup</a></div>`,1)}
async function results(){const db=await claude.use('db'),sn=await db.collection('responses').get(),r=sn.docs.map(d=>d.data()),n=r.length;
 const avg=id=>n?(r.reduce((a,x)=>a+(x[id]??0),0)/n).toFixed(1):'–';
 const dist=id=>{const c={};r.forEach(x=>c[x[id]]=(c[x[id]]||0)+1);return Object.entries(c).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')||'<tr><td>Nessun dato</td></tr>'};
 view(`<div class="kick">Solo per te</div><h1>Risultati <span class="it">finora</span></h1><p class="sub">${n} risposte raccolte.</p>
 <div class="card"><table><tr><th>Caratteristica</th><th>Prodotto nostro</th></tr>${SC.map(([id,nm])=>`<tr><td>${nm}</td><td><b>${avg(id)}</b></td></tr>`).join('')}</table></div>
 <div class="card"><b>Piano scelto</b><table>${dist('piano')}</table></div><div class="card"><b>Disponibilità a pagare</b><table>${dist('wtp')}</table></div>
 <button class="btn g" id="again">Torna all'inizio</button>`,1)}
async function ownerBtn(){try{const u=window.claude&&await claude.use('user');if(u&&await u.isOwner()&&$('#own'))$('#own').innerHTML='<button class="btn g" id="res" style="margin-top:14px;padding:9px 18px;font-size:15px">Risultati (solo per te)</button>'}catch(e){}}
intro();
</script>
</body>
</html>
